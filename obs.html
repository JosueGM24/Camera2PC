<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera2PC — fuente OBS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Pagina para el Browser Source de OBS: negro real y cero adornos, porque
     todo lo que se dibuje aqui acaba en la camara virtual. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;              /* llena el lienzo de OBS sin barras */
    background: #000;
  }
  #overlay {
    position: fixed; inset: 0;
    display: grid; place-content: center;
    text-align: center;
    background: #000;
    transition: opacity .3s;
    font-family: "Bahnschrift SemiCondensed", "Bahnschrift", "DIN Alternate",
                 "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
  }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #msg { font-size: 19px; letter-spacing: .1em; text-transform: uppercase; color: #989ca4; }
  #overlay code {
    display: block; margin-top: 14px;
    font: 600 30px/1 "Cascadia Mono", Consolas, ui-monospace, monospace;
    letter-spacing: .18em; color: #e8a33d;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="overlay">
  <div>
    <div id="msg">Esperando al telefono</div>
    <code id="room"></code>
  </div>
</div>

<script type="module">
  import { startReceiver } from './js/receiver.js';
  import { params, normalizeRoomCode, CONNECTION_LABELS } from './js/util.js';

  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');

  const roomId = normalizeRoomCode(params.get('room'))
    || normalizeRoomCode(localStorage.getItem('camera2pc.room'));

  document.getElementById('room').textContent = roomId || '';

  if (!roomId) {
    msg.textContent = 'Falta el codigo de sala en la URL (?room=ABC123)';
  } else {
    // object-fit: cover recorta; con ?fit=contain se ve el cuadro completo.
    if (params.get('fit') === 'contain') video.style.objectFit = 'contain';
    // OBS permite autoplay con audio; en un navegador normal hace falta silenciar.
    video.muted = params.get('muted') === '1';
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    });

    startReceiver({
      roomId,
      videoEl: video,
      onState: (state, message) => {
        const [label] = CONNECTION_LABELS[state] || [state];
        msg.textContent = message || label;
        overlay.classList.toggle('gone', state === 'connected');
      },
    });
  }
</script>
</body>
</html>
