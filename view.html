<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Monitor - Camera2PC</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;            /* un escritorio NO se recorta */
    background: #000;
  }
  #overlay {
    position: fixed; inset: 0;
    display: grid; place-content: center;
    color: #7d8b9c; text-align: center; background: #000;
    transition: opacity .3s;
  }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #overlay code { font: 700 26px/1.2 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .16em; color: #cfe0f2; }
  #msg { font-size: 18px; }

  /* Barra que se autooculta: en una tablet montada estorba. */
  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 8px; justify-content: center;
    padding: 10px; background: rgba(10,14,20,.82);
    backdrop-filter: blur(6px);
    transition: transform .25s, opacity .25s;
    z-index: 5;
  }
  #bar.hidden { transform: translateY(-100%); opacity: 0; }
  #bar button {
    background: #1c242f; color: #e8eef6; border: 1px solid #2a3441;
    border-radius: 9px; padding: 9px 14px; font: 600 14px/1 inherit;
  }
  #tapzone { position: fixed; inset: 0; z-index: 4; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="tapzone"></div>

<div id="bar">
  <button id="btnFull">Pantalla completa</button>
  <button id="btnFit">Ajuste: contener</button>
  <button id="btnAudio">Activar audio</button>
</div>

<div id="overlay">
  <div>
    <div id="msg">Esperando la pantalla de la PC...</div>
    <div style="margin-top:10px"><code id="room"></code></div>
  </div>
</div>

<script type="module">
  import { startReceiver } from './js/receiver.js';
  import { params, normalizeRoomCode, CONNECTION_LABELS, createWakeLock } from './js/util.js';

  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');

  const roomId = normalizeRoomCode(params.get('room'))
    || normalizeRoomCode(localStorage.getItem('camera2pc.room'));
  document.getElementById('room').textContent = roomId || '';

  // La tablet hace de monitor: no debe apagarse la pantalla.
  createWakeLock().request();

  if (!roomId) {
    msg.textContent = 'Falta el codigo de sala en la URL (?room=ABC123)';
  } else {
    localStorage.setItem('camera2pc.room', roomId);

    video.muted = true;                     // necesario para el autoplay
    video.addEventListener('loadedmetadata', () => video.play().catch(() => {}));

    startReceiver({
      roomId,
      kind: 'screen',
      videoEl: video,
      onState: (state, message) => {
        const [label] = CONNECTION_LABELS[state] || [state];
        msg.textContent = message || label;
        overlay.classList.toggle('gone', state === 'connected');
      },
    });
  }

  // --- barra que se esconde sola --------------------------------------------
  let hideTimer = null;
  const showBar = () => {
    bar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bar.classList.add('hidden'), 3000);
  };
  showBar();
  document.getElementById('tapzone').addEventListener('pointerdown', showBar);

  document.getElementById('btnFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.({ navigationUI: 'hide' });
    showBar();
  };

  document.getElementById('btnFit').onclick = (e) => {
    const cover = video.style.objectFit === 'cover';
    video.style.objectFit = cover ? 'contain' : 'cover';
    e.target.textContent = cover ? 'Ajuste: contener' : 'Ajuste: llenar';
    showBar();
  };

  document.getElementById('btnAudio').onclick = (e) => {
    video.muted = !video.muted;
    if (!video.muted) video.play().catch(() => {});
    e.target.textContent = video.muted ? 'Activar audio' : 'Silenciar';
    showBar();
  };
</script>
</body>
</html>
