<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Monitor — Camera2PC</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* La tablet hace de monitor: negro, sin cromo, y los controles se van solos. */
  :root {
    --face-panel: "Bahnschrift SemiCondensed", "Bahnschrift", "DIN Alternate",
                  "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
    --screen: #3fb8a6;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 15px/1.5 var(--face-panel); color: #ecebe6; }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;            /* un escritorio NO se recorta */
    background: #000;
  }
  #overlay {
    position: fixed; inset: 0;
    display: grid; place-content: center;
    text-align: center; background: #000;
    transition: opacity .3s;
  }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #msg { font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: #989ca4; }
  #overlay code {
    display: block; margin-top: 14px;
    font: 600 30px/1 "Cascadia Mono", Consolas, ui-monospace, monospace;
    letter-spacing: .18em; color: var(--screen);
  }

  /* Barra que se autooculta: en una tablet montada estorba. */
  #bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 8px; justify-content: center;
    padding: 10px; background: rgba(30, 31, 35, .86);
    border-bottom: 1px solid #3b3f46;
    backdrop-filter: blur(8px);
    transition: transform .25s, opacity .25s;
    z-index: 5;
  }
  #bar.hidden { transform: translateY(-100%); opacity: 0; }
  #bar button {
    background: #31343a; color: #ecebe6; border: 1px solid #3b3f46;
    border-radius: 6px; padding: 10px 15px;
    font: 600 12.5px/1 var(--face-panel);
    letter-spacing: .08em; text-transform: uppercase;
  }
  #bar button:focus-visible { outline: 2px solid var(--screen); outline-offset: 2px; }
  #tapzone { position: fixed; inset: 0; z-index: 4; }
  @media (prefers-reduced-motion: reduce) {
    #bar { transition-duration: .001ms; }
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="tapzone"></div>

<div id="bar">
  <button id="btnFull">Pantalla completa</button>
  <button id="btnFit">Ajuste: contener</button>
  <button id="btnAudio">Activar audio</button>
</div>

<div id="overlay">
  <div>
    <div id="msg">Esperando la pantalla de la PC</div>
    <code id="room"></code>
  </div>
</div>

<script type="module">
  import { startReceiver } from './js/receiver.js';
  import { params, normalizeRoomCode, CONNECTION_LABELS, createWakeLock } from './js/util.js';

  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');

  const roomId = normalizeRoomCode(params.get('room'))
    || normalizeRoomCode(localStorage.getItem('camera2pc.room'));
  document.getElementById('room').textContent = roomId || '';

  // La tablet hace de monitor: no debe apagarse la pantalla.
  createWakeLock().request();

  if (!roomId) {
    msg.textContent = 'Falta el codigo de sala en la URL (?room=ABC123)';
  } else {
    localStorage.setItem('camera2pc.room', roomId);

    video.muted = true;                     // necesario para el autoplay
    video.addEventListener('loadedmetadata', () => video.play().catch(() => {}));

    startReceiver({
      roomId,
      kind: 'screen',
      videoEl: video,
      onState: (state, message) => {
        const [label] = CONNECTION_LABELS[state] || [state];
        msg.textContent = message || label;
        overlay.classList.toggle('gone', state === 'connected');
      },
    });
  }

  // --- barra que se esconde sola --------------------------------------------
  let hideTimer = null;
  const showBar = () => {
    bar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bar.classList.add('hidden'), 3000);
  };
  showBar();
  document.getElementById('tapzone').addEventListener('pointerdown', showBar);

  document.getElementById('btnFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.({ navigationUI: 'hide' });
    showBar();
  };

  document.getElementById('btnFit').onclick = (e) => {
    const cover = video.style.objectFit === 'cover';
    video.style.objectFit = cover ? 'contain' : 'cover';
    e.target.textContent = cover ? 'Ajuste: contener' : 'Ajuste: llenar';
    showBar();
  };

  document.getElementById('btnAudio').onclick = (e) => {
    video.muted = !video.muted;
    if (!video.muted) video.play().catch(() => {});
    e.target.textContent = video.muted ? 'Activar audio' : 'Silenciar';
    showBar();
  };
</script>
</body>
</html>
