<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toque</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0a0a0c;
    --text: #f5f5f7;
    --muted: #98989f;
    --accent: #0a84ff;
    --ok: #30d158;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  main {
    text-align: center;
    padding: 48px 24px;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  h1 {
    font-size: 40px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .sub {
    color: var(--muted);
    font-size: 16px;
    margin-top: 8px;
    font-weight: 400;
  }
  .qr {
    width: 232px;
    height: 232px;
    margin: 40px auto 0;
    background: #fff;
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .url {
    margin-top: 28px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .01em;
    user-select: all;
  }
  .status {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px rgba(48,209,88,.6); }
  .err { color: var(--muted); max-width: 40ch; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Toque</h1>
  <p class="sub">Convierte tu teléfono o tablet en teclado y trackpad</p>
  <div id="content">
    <div class="qr" id="qr" hidden></div>
    <p class="url" id="url"></p>
    <p class="status"><span class="dot" id="dot"></span><span id="statusText">Esperando dispositivo…</span></p>
  </div>
</main>
<script>
  const qr = document.getElementById('qr');
  const urlEl = document.getElementById('url');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');

  async function refresh() {
    try {
      const res = await fetch('/info');
      if (res.status === 403) {
        document.getElementById('content').innerHTML =
          '<p class="err" style="margin-top:32px">Por seguridad, el código QR solo se muestra en la PC que ejecuta el servidor.</p>';
        return;
      }
      const info = await res.json();
      qr.hidden = false;
      qr.innerHTML = info.svg;
      urlEl.textContent = info.url;
      dot.classList.toggle('on', info.connected);
      statusText.textContent = info.connected ? 'Dispositivo conectado' : 'Escanea el QR con la cámara de tu teléfono';
    } catch {
      statusText.textContent = 'Servidor no disponible';
    }
    setTimeout(refresh, 2000);
  }
  refresh();
</script>
</body>
</html>
