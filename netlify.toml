[build]
  publish = "."
  # Genera js/env.generated.js a partir de las variables de entorno del sitio.
  # Configuralas en: Site configuration > Environment variables.
  command = "node scripts/build-config.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La senalizacion vive en la funcion, expuesta en una ruta corta.
[[redirects]]
  from = "/api/signal"
  to = "/.netlify/functions/signal"
  status = 200
  force = true

# URLs sin extension. Netlify ya lo hace solo, pero explicito no falla nunca:
# la direccion que se pega en OBS y la que va en el QR quedan mas cortas.
[[redirects]]
  from = "/pc"
  to = "/pc.html"
  status = 200
[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200
[[redirects]]
  from = "/screen"
  to = "/screen.html"
  status = 200
[[redirects]]
  from = "/view"
  to = "/view.html"
  status = 200
[[redirects]]
  from = "/obs"
  to = "/obs.html"
  status = 200

# Y al reves: quien llegue con .html acaba en la forma corta.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301

# getUserMedia exige HTTPS (Netlify ya lo da) y permiso explicito de camara/micro.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# El HTML siempre fresco: si cambias el codigo de sala no quieres una copia vieja.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# El .env nunca debe llegar al sitio publicado.
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true
